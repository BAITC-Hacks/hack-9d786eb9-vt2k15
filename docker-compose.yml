# Поднять фронт и бэк одной командой:  docker compose up --build
# Открыть:  http://localhost:8081
# (порт 8081, чтобы не конфликтовать с `npm run dev` на 5173)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
